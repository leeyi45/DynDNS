on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Validate release tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PROJECT_VERSION=$(./gradlew -q :dyndns:properties \
            | sed -n 's/^version: //p')

          echo "Git tag version: $TAG_VERSION"
          echo "Plugin version:  $PROJECT_VERSION"

          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::Could not determine Gradle project version."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match plugin version ($PROJECT_VERSION)"
            exit 1
          fi

          echo "Release tag version matches plugin version."

      - name: Build plugin
        run: ./gradlew :dyndns:build --no-configuration-cache

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/DynDNS-*.jar
          fail_on_unmatched_files: true